spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:3307/scraper_platform
    driver-class-name: org.mariadb.jdbc.Driver
    username: sh_local
    password: sh_local_pass
  jpa:
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.scraper.platform: DEBUG