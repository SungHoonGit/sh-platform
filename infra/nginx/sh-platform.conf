# sh-platform nginx 설정 (git 버전 관리용)
# 실제 서버: /etc/nginx/sites-available/sh-platform
# 배포 시 deploy-backend.yml이 이 파일을 복사 + reload 합니다.
# 주의: 서버에서 직접 수정한 내용은 다음 배포 때 이 파일로 덮어써집니다.

server {
    server_name sunghoonyk.duckdns.org;

    # root /var/www/html is not used - each location block defines its own root
    index index.html;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP는 먼저 Report-Only로 위반 점검 후 강제 전환 (owasp-hardening.md 참고)
    # script-src에 다음 카카오 우편번호(postcode) CDN을 허용
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/sh-platform;
        internal;
    }

    # === Auth API (port 8080) ===
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui/ {
        rewrite ^/swagger-ui/$ /swagger-ui/index.html permanent;
        rewrite ^/swagger-ui$ /swagger-ui/index.html permanent;
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /v3/ {
        proxy_pass http://127.0.0.1:8080/v3/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === [AUTO-GENERATED SERVICE BLOCKS — 수정 금지, render_config.py가 생성] ===
    # === Scraper API (port 8081) ===
    location = /scraper/swagger-ui.html {
        return 302 /scraper/swagger-ui/index.html;
    }
    location = /scraper/swagger-ui {
        return 302 /scraper/swagger-ui/index.html;
    }
    location = /scraper/api-docs-ui {
        return 302 /scraper/swagger-ui/index.html;
    }
    location /scraper/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 지원을 위한 설정
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # === Resume API (port 8082) ===
    location = /resume/swagger-ui.html {
        return 302 /resume/swagger-ui/index.html;
    }
    location = /resume/swagger-ui {
        return 302 /resume/swagger-ui/index.html;
    }
    location = /resume/api-docs-ui {
        return 302 /resume/swagger-ui/index.html;
    }
    location /resume/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# === [/AUTO-GENERATED SERVICE BLOCKS] ===

    # === Static files ===
    location /test-reports/ {
        alias /home/ubuntu/sh-platform/modules/auth/backend/build/reports/tests/test/;
        autoindex on;
    }
    location /schemaSpy/ {
        alias /var/www/schemaSpy/;
        index index.html;
        autoindex on;
    }
    location /javadoc/ {
        alias /home/ubuntu/sh-platform/modules/auth/backend/build/docs/javadoc/;
        autoindex on;
    }
    location /scraper/test-reports/ {
        alias /home/ubuntu/sh-platform/modules/scraper/backend/build/reports/tests/test/;
        autoindex on;
    }
    location /scraper/javadoc/ {
        alias /home/ubuntu/sh-platform/modules/scraper/backend/build/docs/javadoc/;
        autoindex on;
    }

    # === Monitoring ===
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Webhook ===
    location /webhook {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === Scraper Frontend (module) ===
    location /platform/scraper/ {
        alias /home/ubuntu/sh-platform/modules/scraper/frontend/dist/;
        try_files $uri $uri/ /platform/scraper/index.html;
    }

    # === Platform Frame ===
    location /platform {
        alias /home/ubuntu/sh-platform/platform/frontend/dist;
        try_files $uri $uri/ /platform/index.html;
    }

    # === Scraper SPA Frontend ===
    location = /scraper-ui {
        return 301 /scraper-ui/;
    }
    location /scraper-ui/ {
        alias /home/ubuntu/sh-platform/modules/scraper/frontend/dist/;
        error_page 404 = /scraper-ui/index.html;
    }

    # === Auth Frontend ===
    location / {
        root /home/ubuntu/sh-platform/modules/auth/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sunghoonyk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunghoonyk.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = sunghoonyk.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name sunghoonyk.duckdns.org;
    return 444;
}
