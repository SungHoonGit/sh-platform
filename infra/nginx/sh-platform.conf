# sh-platform nginx 리버스 프록시 (참조용)
#
# 이 파일은 저장소 버전 관리용 참조 설정입니다.
# 서버(/etc/nginx/conf.d/)의 실제 설정을 이 내용과 동기화해야 합니다.
#
# 적용 항목
#   1. server_tokens off            - 버전 정보 노출 차단
#   2. 보안 응답 헤더 추가          - X-Content-Type-Options, X-Frame-Options,
#                                     Referrer-Policy, Permissions-Policy, CSP, HSTS
#   3. error_page 502 503 504       - 인프라 장애 시 브랜딩 502 페이지
#   4. SPA try_files                - /platform/ 딥링크 404 방지
#   5. 압축(gzip)                   - 텍스트 전송량 감소

map $sent_http_content_type $is_compressible {
    default 0;
    ~*text/plain|text/css|application/javascript|application/json 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name sunghoonyk.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sunghoonyk.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/sunghoonyk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunghoonyk.duckdns.org/privkey.pem;

    server_tokens off;

    # --- 보안 응답 헤더 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- 업스트림 ---
    upstream auth_backend       { server 127.0.0.1:8080; }
    upstream scraper_backend    { server 127.0.0.1:8081; }
    upstream resume_backend     { server 127.0.0.1:8082; }
    upstream portfolio_backend  { server 127.0.0.1:8083; }

    # --- 인프라 에러 페이지 (백엔드 미기동 등) ---
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/sh-platform;
        internal;
    }

    # --- 정적 리소스 (프론트 SPA) ---
    location /platform/ {
        alias /home/ubuntu/sh-platform/builds/platform/;
        try_files $uri $uri/ /platform/index.html;
    }

    location = /favicon.ico {
        alias /home/ubuntu/sh-platform/builds/platform/favicon.ico;
    }

    # --- API 라우팅 ---
    location /api/ {
        proxy_pass http://auth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /scraper/ {
        proxy_pass http://scraper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /resume/ {
        proxy_pass http://resume_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /portfolio/ {
        proxy_pass http://portfolio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- 인프라 경로 ---
    location /prometheus/ { proxy_pass http://127.0.0.1:9090/; }
    location /grafana/    { proxy_pass http://127.0.0.1:3000/; }

    # --- 압축 ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
