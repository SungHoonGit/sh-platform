# 이 파일은 자동 생성됩니다 — 수동 수정 금지
# 원본: infra/services.yml  /  생성기: scripts/render_config.py

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot (Micrometer)
  - job_name: "spring-boot"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8080", "localhost:8081", "localhost:8082"]

  - job_name: "prometheus" # Prometheus 자체 모니터링
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter" # Node Exporter (서버 메트릭)
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "mysql" # MariaDB (mysqld_exporter)
    static_configs:
      - targets: ["localhost:9104"]

  - job_name: "redis" # Redis (redis_exporter)
    static_configs:
      - targets: ["localhost:9121"]

  - job_name: "kakao-bot" # Kakao Bot (prometheus_client)
    static_configs:
      - targets: ["localhost:5002"]
