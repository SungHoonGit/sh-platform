name: Deploy Backend & Scraper Frontend

on:
  push:
    branches: [main, master]
    paths:
      - "common/**"
      - "modules/**"
      - "platform/**"
      - "infra/**"
      - "docs/**/*.sql"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/**"
  workflow_dispatch:

# 같은 서버에 두 배포가 겹치면 node_modules/gradle 빌드가 상호 간섭한다 (2026-08-26 사례)
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build and Test All Modules
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"

      - name: Upload Javadocs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: javadocs
          path: "**/build/docs/javadoc/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_WEB_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          password: ${{ secrets.OCI_SSH_PW }}
          script: |
            set -e

            cd /home/ubuntu/sh-platform
            # 배포 서버는 원격과 항상 동일해야 하므로 pull 대신 hard reset
            # (force-push 등으로 이력이 갈라져도 실패하지 않음)
            git fetch origin master
            git reset --hard origin/master

            # Scraper Frontend build (backend JAR에 정적 리소스 포함을 위해 backend 빌드보다 먼저)
            cd modules/scraper/frontend
            rm -rf node_modules .vite || true
            npm install
            npm run build
            cd /home/ubuntu/sh-platform

            # Resume Frontend build (backend JAR에 정적 리소스 포함)
            cd modules/resume/frontend
            rm -rf node_modules .vite || true
            npm install
            npm run build
            cd /home/ubuntu/sh-platform

            # Backend builds
            ./gradlew :common:clean :common:build -q
            ./gradlew :modules:auth:backend:clean :modules:auth:backend:build -q
            ./gradlew :modules:scraper:backend:clean :modules:scraper:backend:build -q
            ./gradlew :modules:resume:backend:clean :modules:resume:backend:build -q

            cp modules/auth/backend/build/libs/sh-platform-auth-*.jar builds/sh-platform-auth.jar
            cp modules/scraper/backend/build/libs/sh-platform-scraper-*.jar builds/sh-platform-scraper.jar
            cp modules/resume/backend/build/libs/sh-platform-resume-*.jar builds/sh-platform-resume.jar

            # Platform Frontend build
            cd platform/frontend
            rm -rf node_modules .vite || true
            npm install
            npm run build
            cd /home/ubuntu/sh-platform

            # Auth Frontend build
            cd modules/auth/frontend
            rm -rf node_modules .vite || true
            npm install
            npm run build
            cd /home/ubuntu/sh-platform

            # DDL 먼저 실행 (scraper가 ddl-auto:validate 이므로 재시작 전 필수)
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v2.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v3.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v4.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v5.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v6.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v7.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' scraper_platform < docs/scraper/ddl-v8.sql
            # resume DDL (IF NOT EXISTS 라 매 배포 실행해도 무해)
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v1.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v2.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v3.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v4.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v5.sql
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' resume_platform < docs/resume/ddl-resume-v6.sql
            # auth 감사 로그 테이블 (IF NOT EXISTS 라 매 배포 실행해도 무해)
            mysql -h 10.0.0.39 -u sh_user -p'SHpass1234!' sh_pass < docs/auth/ddl-login-audit-v1.sql

            # Infra config sync (infra/services.yml 에서 생성된 파일 — render_config.py 산출물)
            sudo cp infra/generated/prometheus.yml /etc/prometheus/prometheus.yml
            sudo cp infra/generated/promtail-config.yaml /etc/promtail/promtail-config.yaml
            sudo cp infra/generated/systemd/*.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl reload prometheus
            sudo systemctl restart promtail

            sudo systemctl stop sh-platform-auth sh-platform-scraper sh-platform-resume 2>/dev/null || true
            sleep 2

            sudo systemctl start sh-platform-auth && sleep 10
            sudo systemctl start sh-platform-scraper sh-platform-resume

            # Nginx config sync (git managed)
            sudo mkdir -p /var/www/sh-platform
            sudo cp infra/nginx/502.html /var/www/sh-platform/502.html
            sudo cp infra/nginx/sh-platform.conf /etc/nginx/sites-available/sh-platform
            sudo cp infra/nginx/sh-platform.conf /etc/nginx/sites-enabled/sh-platform
            sudo nginx -t
            sudo systemctl reload nginx

            # Log dump (diagnostics): 스크래퍼 최근 오류 로그
            echo "===== SCRAPER LOGS (last 6h) ====="
            sudo journalctl -u sh-platform-scraper --no-pager --since "6 hours ago" | grep -B2 -A40 "Unhandled exception\|ERROR" | tail -n 200 || true
            echo "===== END SCRAPER LOGS ====="

            echo "Deploy complete!"
